services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "wallet"]
      interval: 2s
      retries: 30
  api:
    build: .
    image: wallet:v1
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    image: wallet:v1
    command: ["python3", "worker.py"]
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet
    depends_on:
      postgres: {condition: service_healthy}
